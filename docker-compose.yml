services:
  db:
    image: postgres:16-alpine
    container_name: school-tracking-db
    environment:
      POSTGRES_DB: school_tracking
      POSTGRES_USER: school
      POSTGRES_PASSWORD: ${DB_PASSWORD:-school}
    ports:
      - "5432:5432"
    volumes:
      - school_tracking_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school -d school_tracking"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: school-tracking-backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/school_tracking
      DB_USER: school
      DB_PASSWORD: ${DB_PASSWORD:-school}
      SERVER_PORT: 8080
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/subjects >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    container_name: school-tracking-frontend
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"

volumes:
  school_tracking_data: