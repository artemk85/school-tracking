services:
  db:
    image: postgres:16-alpine
    container_name: school-tracking-db
    environment:
      POSTGRES_DB: school_tracking
      POSTGRES_USER: school
      POSTGRES_PASSWORD: school
    ports:
      - "5432:5432"
    volumes:
      - school_tracking_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school -d school_tracking"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  school_tracking_data: