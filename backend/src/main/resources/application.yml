spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/school_tracking}
    username: ${DB_USER:school}
    password: ${DB_PASSWORD:school}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  sql:
    init:
      mode: always
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}

app:
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-in-production-school-tracking-secret-key-256bit}
      ttl-hours: ${JWT_TTL_HOURS:168}

logging:
  level:
    com.artemk.schooltracking: DEBUG
    org.springframework.web: DEBUG